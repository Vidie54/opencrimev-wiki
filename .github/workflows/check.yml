# The pull-request check: validates wiki.json, every page, its links and
# placeholders. Nothing is built or deployed from here — the website and the
# in-game wiki read this repo directly.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check.py
