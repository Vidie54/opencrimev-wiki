<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCrimeV Wiki</title>
  <meta name="description" content="Guides, rules, jobs and mechanics of the OpenCrimeV FiveM server.">
  <meta property="og:title" content="OpenCrimeV Wiki">
  <meta property="og:description" content="Guides, rules, jobs and mechanics of the OpenCrimeV FiveM server.">
  <meta name="theme-color" content="#0e0e11">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0e11'/%3E%3Ctext x='16' y='23' font-family='Impact,Arial Narrow,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23f0c420'%3EV%3C/text%3E%3C/svg%3E">
  <script>
    // Deployed: index.html sits next to renderer/ and dist/. Local preview:
    // web/index.html one level down. Same file, either way.
    window.WIKI_BASE = /\/web\/(index\.html)?$/.test(location.pathname) ? "../" : "./";
    document.write('<link rel="stylesheet" href="' + WIKI_BASE + 'renderer/wiki.css">');
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #0e0e11; }
    [data-theme="light"] body { background: #f4f4f6; }
    #wiki { height: 100%; }
    .boot { display: flex; align-items: center; justify-content: center; height: 100%; color: #8b8f98; font: 14px system-ui, sans-serif; text-align: center; padding: 20px; }
    .boot code { color: #f0c420; }
  </style>
</head>
<body>
  <div id="wiki"><div class="boot">Loading the wiki…</div></div>

  <script>document.write('<script src="' + WIKI_BASE + 'renderer/md.js"><\/script><script src="' + WIKI_BASE + 'renderer/wiki.js"><\/script>');</script>
  <script>
    (async function () {
      const base = window.WIKI_BASE;
      const get = async (p, optional) => {
        try {
          const r = await fetch(base + p, { cache: "no-cache" });
          if (!r.ok) throw new Error(r.status + " " + p);
          return await r.json();
        } catch (e) {
          if (optional) return null;
          throw e;
        }
      };

      try {
        const [content, search, keys, vars] = await Promise.all([
          get("dist/content.json"),
          get("dist/search.json"),
          get("dist/keys.json", true),
          get("dist/vars.json", true),
        ]);
        const keyMap = (keys && keys.keyboard) || keys || {};

        Wiki.mount(document.getElementById("wiki"), {
          host: "web",
          content,
          search,
          vars: vars || {},
          assetBase: base + "assets/",
          keyDefaults: keyMap,
          resolveKeys: () => ({}),
          sourceLabel: content.built ? "Built " + String(content.built).slice(0, 10) : "",
        });
      } catch (e) {
        document.getElementById("wiki").innerHTML =
          '<div class="boot">The wiki content is not built yet.<br>Run <code>python tools/build.py</code> and serve the repo root, e.g. <code>python -m http.server</code>, then open <code>/web/</code>.<br><small>' +
          String(e).replace(/</g, "&lt;") + "</small></div>";
      }
    })();
  </script>
</body>
</html>
